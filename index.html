<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>InterApp | Intercambia lo que ya no usas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="landing">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a
          class="navbar-brand d-inline-flex align-items-center"
          href="index.html"
          aria-label="InterApp, inicio"
          ><img
            src="assets/images/logo-interapp.png"
            class="brand-logo brand-logo-landing"
            alt="InterApp - Intercambio Fácil"
        /></a>
        <div class="ms-auto d-flex gap-2">
          <a class="btn btn-outline-primary" href="pages/login.html"
            >Iniciar sesión</a
          ><a class="btn btn-primary" href="pages/registro.html"
            >Crear cuenta</a
          >
        </div>
      </div>
    </nav>
    <main class="container py-5">
      <section class="landing-banner" aria-label="Banner de InterApp">
        <div
          data-interapp-banner
          data-image-prefix="assets/images/"
          data-action-href="pages/registro.html"
          data-action-text="Comenzar a intercambiar"
        ></div>
      </section>
      <section class="py-5 text-center">
        <h2 class="fw-bold">¿Cómo funciona?</h2>
        <div class="row g-3 mt-2">
          <div class="col-md-4">
            <div class="feature-card">
              <span>1</span>
              <h5>Publica</h5>
              <p>Agrega una foto y describe lo que quieres intercambiar.</p>
            </div>
          </div>
          <div class="col-md-4">
            <div class="feature-card">
              <span>2</span>
              <h5>Encuentra</h5>
              <p>Explora productos y acuerda un intercambio.</p>
            </div>
          </div>
          <div class="col-md-4">
            <div class="feature-card">
              <span>3</span>
              <h5>Intercambia</h5>
              <p>Haz seguimiento hasta completar el intercambio.</p>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="text-center py-4 text-secondary">
      InterApp · Proyecto integrador
    </footer>
    <script type="module" src="js/banner.js"></script>
    \n
  </body>
</html>
