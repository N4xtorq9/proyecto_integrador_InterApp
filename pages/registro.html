<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta | InterApp</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/styles.css"></head>
<body class="auth-page"><main class="auth-card"><a href="../index.html" class="login-brand" aria-label="InterApp - inicio">
<img src="../assets/images/logo-interapp.png" alt="InterApp - Intercambio Fácil">
</a><h1>Únete a InterApp</h1><p class="text-secondary">Crea tu cuenta para comenzar a intercambiar.</p>
<form id="registerForm" novalidate><label class="form-label" for="name">Nombre</label><input class="form-control mb-3" id="name" maxlength="70" required autocomplete="name"><label class="form-label" for="email">Correo electrónico</label><input class="form-control mb-3" id="email" type="email" required autocomplete="email"><label class="form-label" for="password">Contraseña</label><input class="form-control mb-3" id="password" type="password" minlength="6" required autocomplete="new-password"><label class="form-label" for="confirm">Confirmar contraseña</label><input class="form-control mb-3" id="confirm" type="password" minlength="6" required><div id="formError" class="form-error" role="alert"></div><button class="btn btn-primary w-100">Crear cuenta</button></form>
<p class="mt-4 mb-0 text-center">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p><p class="demo-note">Los datos se guardan solo en este navegador durante esta demostración.</p></main><script type="module" src="../js/auth.js"></script></body></html>
